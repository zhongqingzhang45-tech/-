<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <title>Life - 二次元 AI 虚拟伴侣</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="Life - 面向国内用户的沉浸式二次元 AI 虚拟伴侣，支持 Live2D/VRM 角色、智能聊天与语音互动。">
    <meta name="apple-mobile-web-app-title" content="Life" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="rgb(18,18,18)" id="themeColor" />

    <!-- Open Graph Protocol -->
    <meta property="og:title" content="Life - 二次元 AI 虚拟伴侣">
    <meta property="og:site_name" content="Life">
    <meta property="og:image" content="/open-graph.png">
    <meta property="og:description" content="Life - 面向国内用户的沉浸式二次元 AI 虚拟伴侣，支持 Live2D/VRM 角色、智能聊天与语音互动。">

    <!-- Open Graph Protocol extension, Twitter cards -->
    <meta name="twitter:title" content="Life - 二次元 AI 虚拟伴侣">
    <meta name="twitter:description" content="Life - 面向国内用户的沉浸式二次元 AI 虚拟伴侣，支持 Live2D/VRM 角色、智能聊天与语音互动。">
    <meta name="twitter:image" content="https://airi.moeru.ai/open-graph.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:creator" content="Moeru AI">
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'light' || (prefersDark && setting !== 'dark'))
          document.querySelector('#themeColor')?.setAttribute('content', 'rgb(255,255,255)')
      })()
    </script>
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
    <!-- Live2D Cubism Core SDK (由 unplugin-live2d-sdk 在构建时下载) -->
    <script src="/assets/js/CubismSdkForWeb-5-r.3/Core/live2dcubismcore.min.js"></script>
  </head>
  <body class="font-sans">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <noscript> Life 需要启用 JavaScript 才能正常运行，请在浏览器设置中开启 JavaScript。</noscript>
  </body>
</html>
