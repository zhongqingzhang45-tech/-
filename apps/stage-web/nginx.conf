# Life: nginx 模板 for SPA + 静态资产 + API 反代
# 模板变量在容器启动时由 20-envsubst 替换：
#   ${API_UPSTREAM}  后端服务地址（host:port），默认 backend:3000
#
# - SPA fallback: vue-router history mode 未匹配路由回退到 index.html
# - 静态资产缓存: /assets/* 长缓存
# - gzip: 弥补 LIFE_DISABLE_MINIFY=1 的产物体积
# - 安全头: 基础安全头（CSP report-only，Phase 2 再 enforce）
# - API/WS 反代: /api/* /ws/* 反代到后端

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # resolver 让 proxy_pass 可以直接用变量（运行时解析）
  resolver 127.0.0.11 valid=10s ipv6=off;

  # gzip 弥补 LIFE_DISABLE_MINIFY=1 导致的产物体积
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml
    application/wasm
    font/ttf
    application/octet-stream;

  # 安全头
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # Phase 2 security: CSP switched from report-only to enforce
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cubism.live2d.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self' https: wss: ws:; media-src 'self' blob: data: https:; font-src 'self' data:; worker-src 'self' blob:; manifest-src 'self'" always;

  # 静态资产长缓存（vite 产物带 hash）
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Live2D / VRM 模型资产（大文件，长缓存但不 immutable，便于热更新）
  location ~* \.(vrm|vrma|cmo3|zip)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # wasm / 字体
  location ~* \.(wasm|ttf)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }

  # API 反代到后端（API_UPSTREAM 通过 envsubst 注入，如 backend:3000）
  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # WebSocket 反代（聊天的实时通道）
  location /ws/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # PWA service worker / manifest 不缓存
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # SPA fallback: vue-router history mode 所有未匹配路由回退到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 健康检查
  location = /healthz {
    access_log off;
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
